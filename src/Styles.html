<style>
/* ============================================================
   Brainule v1 — Styles
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --color-bg:          #f5f6f8;
  --color-surface:     #ffffff;
  --color-border:      #dde1e7;
  --color-text:        #1a1d23;
  --color-text-muted:  #6b7280;
  --color-accent:      #3b5bdb;
  --color-accent-hover:#2f4ac4;
  --color-correct:     #2d9e5a;
  --color-incorrect:   #c0392b;
  --color-choice-hover:#eef1fb;
  --color-choice-sel:  #d0d9f7;
  --color-code-bg:     #f0f2f5;
  --radius:            8px;
  --shadow:            0 1px 4px rgba(0,0,0,.10);
  --font-mono:         'Courier New', Courier, monospace;
  --header-h:          48px;
  --topic-w:           260px;
  --meta-w:            340px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  background: var(--color-bg);
  color: var(--color-text);
  height: 100vh;
  overflow: hidden;
}

/* ── Layout ────────────────────────────────────────────────── */

#app-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#app-header {
  height: var(--header-h);
  background: var(--color-accent);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 20px;
  flex-shrink: 0;
  box-shadow: var(--shadow);
}

#app-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .5px;
}

#app-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Left panel — topics ───────────────────────────────────── */

#panel-topics {
  width: var(--topic-w);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  overflow-y: auto;
  flex-shrink: 0;
}

#panel-topics h2 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--color-text-muted);
  padding: 14px 16px 8px;
  border-bottom: 1px solid var(--color-border);
}

.topic-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid var(--color-border);
  padding: 10px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--color-text);
  transition: background .12s;
}

.topic-btn:hover { background: var(--color-choice-hover); }

.topic-btn.active {
  background: var(--color-choice-sel);
  color: var(--color-accent);
  font-weight: 600;
}

/* ── Middle panel — metadata ───────────────────────────────── */

#panel-meta {
  width: var(--meta-w);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 20px;
}

#meta-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 10px;
  line-height: 1.4;
}

#meta-scope {
  font-size: 13px;
  color: var(--color-text-muted);
  line-height: 1.65;
}

#meta-path {
  margin-top: 14px;
  font-size: 11px;
  color: var(--color-text-muted);
  letter-spacing: .3px;
}

.meta-empty {
  color: var(--color-text-muted);
  font-style: italic;
  margin-top: 40px;
  text-align: center;
}

/* ── Right panel — question ────────────────────────────────── */

#panel-question {
  flex: 1;
  overflow-y: auto;
  padding: 20px 28px;
  background: var(--color-bg);
}

#panel-question.expanded {
  position: fixed;
  inset: var(--header-h) 0 0 0;
  z-index: 100;
  background: var(--color-surface);
  padding: 28px 60px;
}

/* progress + controls row */
#q-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

#q-progress {
  flex: 1;
  font-size: 13px;
  color: var(--color-text-muted);
}

.ctrl-btn {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 5px 14px;
  font-size: 13px;
  cursor: pointer;
  color: var(--color-text);
  transition: background .12s, opacity .12s;
}

.ctrl-btn:hover:not(:disabled) { background: var(--color-choice-hover); }
.ctrl-btn:disabled { opacity: .38; cursor: default; }

#btn-expand {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  padding: 4px 8px;
  color: var(--color-text-muted);
}

/* question card */
#q-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow);
}

#q-difficulty {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--color-text-muted);
  margin-bottom: 6px;
}

#q-subtopic {
  font-size: 12px;
  color: var(--color-text-muted);
  margin-bottom: 14px;
  font-style: italic;
}

#q-text {
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 20px;
  white-space: pre-wrap;
}

/* choices */
#q-choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.choice-btn {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  text-align: left;
  transition: background .12s, border-color .12s;
  line-height: 1.5;
}

.choice-btn:hover:not(:disabled) {
  background: var(--color-choice-hover);
  border-color: var(--color-accent);
}

.choice-btn:disabled { cursor: default; }

.choice-key {
  font-weight: 700;
  min-width: 20px;
  color: var(--color-accent);
  flex-shrink: 0;
}

.choice-btn.correct {
  background: #eafaf1;
  border-color: var(--color-correct);
}

.choice-btn.correct .choice-key { color: var(--color-correct); }

.choice-btn.incorrect {
  background: #fdecea;
  border-color: var(--color-incorrect);
}

.choice-btn.incorrect .choice-key { color: var(--color-incorrect); }

/* explanation */
#q-explanation {
  display: none;
  margin-top: 16px;
  border-top: 1px solid var(--color-border);
  padding-top: 16px;
}

#q-explanation.visible { display: block; }

#q-result-label {
  font-weight: 700;
  margin-bottom: 8px;
}

#q-result-label.correct { color: var(--color-correct); }
#q-result-label.incorrect { color: var(--color-incorrect); }

#q-answer-line {
  font-size: 13px;
  color: var(--color-text-muted);
  margin-bottom: 10px;
}

#q-explanation-text {
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
}

/* Gemini button */
#btn-gemini {
  display: none;
  margin-top: 14px;
  background: var(--color-accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 8px 18px;
  font-size: 13px;
  cursor: pointer;
  transition: background .12s;
}

#btn-gemini.visible { display: inline-block; }
#btn-gemini:hover { background: var(--color-accent-hover); }

#gemini-feedback {
  display: inline-block;
  margin-left: 10px;
  font-size: 12px;
  color: var(--color-correct);
  opacity: 0;
  transition: opacity .3s;
}

/* Empty / error states */
.state-empty, .state-error {
  padding: 24px;
  color: var(--color-text-muted);
  font-style: italic;
  text-align: center;
}

.state-error { color: var(--color-incorrect); }

/* ── Code rendering ────────────────────────────────────────── */

code, .code-inline {
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--color-code-bg);
  border-radius: 3px;
  padding: 1px 5px;
}

pre, .code-block {
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--color-code-bg);
  border-radius: var(--radius);
  padding: 12px 16px;
  overflow-x: auto;
  white-space: pre;
  margin: 10px 0;
  line-height: 1.5;
}

/* ── Scrollbars (webkit) ───────────────────────────────────── */

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
</style>
